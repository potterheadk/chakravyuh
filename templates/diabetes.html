<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Healthcare Hub - Diabetes Analytics</title>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='css/diabetes.css') }}"
        />
    </head>
    <body>
        <div class="grid-pattern"></div>

        <div class="container">
            <h1>Diabetes Risk Analysis</h1>

            <div class="form-container">
                <form id="diabetesForm" onsubmit="predictDiabetes(event)">
                    <div class="input-group">
                        <label class="input-label" for="pregnancies"
                            >Number of Pregnancies</label
                        >
                        <input
                            type="number"
                            id="pregnancies"
                            class="input-field"
                            required
                            min="0"
                        />
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="glucose"
                            >Glucose Level (mg/dL)</label
                        >
                        <input
                            type="number"
                            id="glucose"
                            class="input-field"
                            required
                            min="0"
                        />
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="blood_pressure"
                            >Blood Pressure (mm Hg)</label
                        >
                        <input
                            type="number"
                            id="blood_pressure"
                            class="input-field"
                            required
                            min="0"
                        />
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="skin_thickness"
                            >Skin Thickness (mm)</label
                        >
                        <input
                            type="number"
                            id="skin_thickness"
                            class="input-field"
                            required
                            min="0"
                        />
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="insulin"
                            >Insulin Level (mu U/ml)</label
                        >
                        <input
                            type="number"
                            id="insulin"
                            class="input-field"
                            required
                            min="0"
                        />
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="bmi">BMI</label>
                        <input
                            type="number"
                            id="bmi"
                            class="input-field"
                            required
                            min="0"
                            step="0.1"
                        />
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="diabetes_pedigree"
                            >Diabetes Pedigree Function</label
                        >
                        <input
                            type="number"
                            id="diabetes_pedigree"
                            class="input-field"
                            required
                            min="0"
                            step="0.001"
                        />
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="age">Age</label>
                        <input
                            type="number"
                            id="age"
                            class="input-field"
                            required
                            min="0"
                        />
                    </div>

                    <button type="submit" class="submit-btn">
                        Analyze Risk
                    </button>
                </form>
            </div>

            <div class="loading">
                <div class="spinner"></div>
            </div>

            <div id="results" class="results-container">
                <div class="result-item">
                    <h3>Prediction Result</h3>
                    <p id="prediction"></p>
                    <p id="probability"></p>
                </div>

                <div class="result-item">
                    <h3>Precautions</h3>
                    <p id="precautions"></p>
                </div>

                <div class="result-item">
                    <h3>Medications</h3>
                    <p id="medications"></p>
                </div>

                <a
                    href="/download_report"
                    class="download-btn"
                    id="downloadReport"
                    >Download Detailed Report</a
                >
            </div>
        </div>

        <script>
            async function predictDiabetes(event) {
                event.preventDefault();

                const loading = document.querySelector(".loading");
                const results = document.getElementById("results");

                loading.style.display = "block";
                results.style.display = "none";

                const formData = {
                    pregnancies: document.getElementById("pregnancies").value,
                    glucose: document.getElementById("glucose").value,
                    blood_pressure:
                        document.getElementById("blood_pressure").value,
                    skin_thickness:
                        document.getElementById("skin_thickness").value,
                    insulin: document.getElementById("insulin").value,
                    bmi: document.getElementById("bmi").value,
                    diabetes_pedigree:
                        document.getElementById("diabetes_pedigree").value,
                    age: document.getElementById("age").value,
                };

                try {
                    const response = await fetch("/predict_diabetes", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify(formData),
                    });

                    const data = await response.json();

                    loading.style.display = "none";
                    results.style.display = "block";

                    // Displaying results from the server response
                    document.getElementById("prediction").textContent =
                        `Prediction: ${data.prediction}`;
                    document.getElementById("probability").textContent =
                        `Probability: ${data.probability}%`;
                    document.getElementById("precautions").textContent =
                        data.precautions;
                    document.getElementById("medications").textContent =
                        data.medications;

                    // Optionally, enable download report link if available
                    if (data.download_report_link) {
                        document.getElementById("downloadReport").href =
                            data.download_report_link;
                        document.getElementById(
                            "downloadReport",
                        ).style.display = "inline-block";
                    } else {
                        document.getElementById(
                            "downloadReport",
                        ).style.display = "none";
                    }
                } catch (error) {
                    loading.style.display = "none";
                    alert("An error occurred. Please try again later.");
                    console.error(error);
                }
            }
        </script>
    </body>
</html>
